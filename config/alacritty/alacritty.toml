[window]
opacity = 0.9
decorations = "none"
padding = { x = 4, y = 4}
dynamic_padding = true
blur = true

[font]
size = 11
normal = { family = "JetbrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetbrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetbrainsMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#1e1e2e" # Fondo
foreground = "#6aa6f4" # Texto

[cursor]
style = "Beam"

[terminal.shell]
program = "/bin/bash"

