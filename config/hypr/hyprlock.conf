# hyprlock - lock screen (Dracula, solid background: no screenshot/blur cost)
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(282a36)
}

label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 72
    color = rgb(f8f8f2)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = rgb(bd93f9)
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    rounding = 10
    outer_color = rgb(bd93f9) rgb(ff79c6) 45deg
    inner_color = rgb(44475a)
    font_color = rgb(f8f8f2)
    check_color = rgb(50fa7b)
    fail_color = rgb(ff5555)
    placeholder_text = <span foreground="##6272a4">Contraseña</span>
    fail_text = Incorrecta
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
